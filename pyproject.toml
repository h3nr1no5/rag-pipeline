[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG pipeline with local LLM, MLX acceleration, and Streamlit UI"
requires-python = ">=3.11,<3.13"
authors = [{name = "Developer"}]

dependencies = [
    "faiss-cpu>=1.10",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "dspy>=2.6",
    "pillow>=11",
    "pyyaml>=6.0",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "llama-index-core>=0.11",
    "sentence-transformers>=3",
    "streamlit>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "mlx>=0.18",
    "mlx-lm>=0.18",
    "rank-bm25>=0.2.2",
    "pdfminer.six>=20221105",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Pure logic tests, no I/O or database",
    "integration: Tests requiring database or service layer",
    "e2e: Full application bootstrap tests",
    "fast: Completes in under 0.5s",
    "slow: Takes 0.5s or longer (often LLM-dependent)",
    "flaky: Known to be intermittently unreliable",
    "needs_llm: Requires LLM model to be loaded",
    "needs_db: Requires database connection",
    "needs_disk: Requires file I/O (uploads, PDFs)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["F", "E", "W", "I", "N", "UP", "RUF"]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true
implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llama_index"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llama_index.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dspy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.unit.test_link_resolution",
    "tests.unit.test_link_traversal",
    "tests.unit.test_link_augmentation",
    "tests.integration.test_link_aware_rag",
]
ignore_errors = true
