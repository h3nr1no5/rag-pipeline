[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG pipeline with local LLM, MLX acceleration, and Streamlit UI"
requires-python = ">=3.11,<3.13"
authors = [{name = "Developer"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "pillow>=11",
    "pyyaml>=6.0",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "llama-index>=0.11",
    "llama-index-core>=0.11",
    "llama-index-embeddings-huggingface>=0.4",
    "llama-index-readers-sqlite>=0.1",
    "sentence-transformers>=3",
    "faiss-cpu>=1.9",
    "streamlit>=1.40",
    "requests>=2.32",
    "sseclient>=0.0.27",
    "aiofiles>=24.0",
    "python-dotenv>=1.0",
    "mlx>=0.18",
    "mlx-lm>=0.18",
    "rank-bm25==0.2.2",
    "pdfminer.six>=20221105,<20240000",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
