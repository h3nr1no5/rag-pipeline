strategies:
  - name: "Recursive"
    engine_type: "recursive"
    chunk_size: 500
    chunk_overlap: 50
    separators: ["\n\n", "\n", ". "]
  - name: "Semantic"
    engine_type: "semantic"
    chunk_size: 300
    chunk_overlap: 30
    separators: ["\n## ", "\n### ", "\n", "## ", "### "]
  - name: "API Documentation"
    engine_type: "api-docs"
    chunk_size: 0
    chunk_overlap: 0
    separators: []
    use_hyperlinks: true
    config:
      min_chunk_length: 20
      type_patterns:
        interface: ["^I[A-Z]\\w+"]
        enum: ["^E[A-Z]\\w+"]
        record: ["^R[A-Z]\\w+"]
      heading_policy:
        interface_levels: [0, 1, 2, 3, 4]
        section_levels: [3]
        ignore_levels: []
      max_depth: 3
      format_style: "detailed"
      include_signatures: true
      include_descriptions: true
